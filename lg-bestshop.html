
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LG전자 베스트샵 | CitrusAvenue</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f8f7f3;
      font-family: Arial, sans-serif;
      color: #171717;
    }

    .page {
      min-height: 100vh;
      background-image: url("portfolio-bg.jpg");
      background-position: center top;
      background-size: 100% auto;
      background-repeat: no-repeat;
    }

    .cover {
      height: 43vw;
      max-height: 650px;
      min-height: 300px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15%;
      color: white;
      text-align: center;
    }

    .cover p {
      margin: 0;
      font-size: 24px;
    }

    .cover h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(52px, 7vw, 110px);
      font-weight: normal;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 30px 120px;
      text-align: center;
    }

.back {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 48px;
  height: 48px;

  border: 2px solid #888;
  border-radius: 50%;

  color: #888;
  text-decoration: none;

  margin-top: 50px;
  margin-bottom: 45px;
}

.back svg {
  width: 30px;
  height: 30px;
}

    .brand-logo {
      width: 250px;
      max-width: 75%;
      display: block;
      margin: 0 auto 70px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .gallery a {
      display: block;
      text-decoration: none;
    }

    .gallery img {
      width: 100%;
      display: block;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      .content { padding: 35px 20px 80px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cover p { font-size: 16px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="cover">
      <div>
        <p>CitrusAvenue's</p>
        <h1>Portfolio</h1>
      </div>
    </header>

    <main class="content">
      <a href="index.html" class="back" aria-label="메인으로 돌아가기">
  <svg viewBox="0 0 48 48" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <path d="M22 7L5 24L22 41"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M6 24H43"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </svg>
</a>

      <img
        class="brand-logo"
        src="./lg-bestshop.svg"
        alt="LG전자 베스트샵"
      >

      <div class="gallery">
        <a href="#"><img src="work01.jpg" alt="작업물 1"></a>
      </div>
    </main>
  </div>
</body>
</html>
