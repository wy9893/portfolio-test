
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CitrusAvenue Portfolio</title>
  <style>
    @font-face {
  font-family: 'Chetta Vissto';
  src: url('ChettaVissto.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #171717;
      background-color: #f8f7f3;
      font-family: Arial, sans-serif;
    }

    .page {
      min-height: 100vh;
      background-image: url("portfolio-bg.jpg");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
    }

    .cover {
      height: 49vw;
      max-height: none;
      min-height: 300px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15%;
      text-align: center;
      color: white;
    }

    .cover h1 {
      margin: 0;
      font-family: 'Chetta Vissto', Georgia, serif;
      font-weight: normal;
      font-size: clamp(42px, 6vw, 84px);
      line-height: 1;
    }

    .cover p {
      margin: 0 0 8px;
      font-family: 'Chetta Vissto', Georgia, serif;
      font-size: clamp(17px, 2.4vw, 30px);
    }

    .content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 24px 120px;
      text-align: center;
    }

    .content h2 {
      font-family: 'Chetta Vissto', Georgia, serif;
      font-weight: normal;
      font-size: clamp(32px, 4vw, 48px);
      margin-bottom: 90px;
    }

    .clients {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 85px 70px;
      max-width: 720px;
      margin: 0 auto;
    }

    .client {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #333;
      font-size: 25px;
      font-weight: bold;
      transition: transform .2s;
    }

    .client:hover {
      transform: scale(1.05);
    }

   

/* 모바일 전용 */
@media (max-width: 650px) {

  /* 상단 표지 */
  .cover {
    height: 49vw;
    min-height: 0;
    padding: 0 20px;
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .cover > div {
    width: 100%;
    text-align: center;
    margin-top: 10vw;
    transform: none;
  }

  .cover p {
    font-size: clamp(15px, 3.4vw, 20px);
    margin-bottom: 5px;
  }

  .cover h1 {
    font-size: clamp(40px, 8vw, 56px);
  }

  /* Contractor 영역 */
  .content {
    padding: 22px 24px 55px;
  }

  .content h2 {
    font-size: clamp(30px, 6vw, 42px);
    margin-bottom: 30px;
  }

  /* 업체 로고 */
  .clients {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 30px 18px;
  }

  .client {
    min-height: 70px;
  }


.client img,
.client:first-child img {
  width: 100%;
  max-width: 105px;
  height: 48px;
  object-fit: contain;
  margin: 0 auto;
  display: block;
}

}

    .client img {
  display: block;
  width: 100%;
  max-width: 170px;
  height: 65px;
  object-fit: contain;
  margin: 0 auto;
}
    .client:first-child img {
  max-width: 220px;
  height: 85px;
}

    
@media (max-width: 650px) {
  .clients .client img {
    width: 105px !important;
    max-width: 105px !important;
    height: 48px !important;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
}

  </style>
</head>
<body>
  <div class="page">

    <header class="cover">
      <div>
        <p>CitrusAvenue's</p>
        <h1>Portfolio</h1>
      </div>
    </header>

    <main class="content">
      <h2>Contractor</h2>

      <div class="clients">
<a class="client" href="lg-bestshop.html">
  <img src="./lg-bestshop.svg" alt="LG전자 베스트샵">
</a>

<a class="client" href="paiks.html">
  <img src="./paiks.svg" alt="빽다방">
</a>

<a class="client" href="bom-on.html">
  <img src="./bom-on.svg" alt="청담봄온">
</a>

<a class="client" href="kbpay.html">
  <img src="./kbpay.svg" alt="KB Pay">
</a>
      </div>
    </main>

  </div>
</body>
</html>
