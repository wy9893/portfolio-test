
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CitrusAvenue Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5ef;
      color: #222;
    }
    header {
      background: #ef762a;
      padding: 80px 24px;
      text-align: center;
    }
    header h1 {
      font-size: clamp(36px, 7vw, 76px);
      margin: 0;
    }
    header p { font-size: 20px; }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 60px 24px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: transform .2s;
    }
    .item:hover { transform: translateY(-5px); }
    .preview {
      aspect-ratio: 4 / 5;
      background: #e8e2d8;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-size: 24px;
    }
    @media (max-width: 650px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>CitrusAvenue</h1>
    <p>Creative Portfolio</p>
  </header>

  <main>
    <h2>Our Works</h2>
    <div class="gallery">
      <div class="item"><div class="preview">01</div><h3>LG전자 베스트샵</h3></div>
      <div class="item"><div class="preview">02</div><h3>Branding</h3></div>
      <div class="item"><div class="preview">03</div><h3>Promotion</h3></div>
    </div>
  </main>
</body>
</html>
