
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Project</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f7f3;
      font-family: Arial, sans-serif;
      color: #777;
    }

    .page {
      min-height: 100vh;
      padding: 45px 30px 70px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .back {
      width: 48px;
      height: 48px;
      border: 1.5px solid #999;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      text-decoration: none;
    }

    .back svg {
      width: 30px;
      height: 30px;
    }

    .brand-logo {
      display: block;
      width: 250px;
      max-width: 75%;
      height: auto;
      margin: 55px auto 75px;
    }

    .main-artwork {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 650px;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
      cursor: zoom-in;
    }

    .thumbnail-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
    }

    .thumb-arrow {
      flex: 0 0 28px;
      border: 0;
      background: transparent;
      color: #888;
      font-size: 36px;
      cursor: pointer;
      padding: 0;
    }

    .thumb-arrow:disabled {
      opacity: .25;
      cursor: default;
    }

    .thumbnails {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 1 / 1.35;
      object-fit: cover;
      cursor: pointer;
      opacity: .65;
      border: 2px solid transparent;
    }

    .thumbnail.active {
      opacity: 1;
      border-color: #777;
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: #999;
      margin-top: 20px;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, .94);
      align-items: center;
      justify-content: center;
      padding: 55px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      right: 20px;
      top: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 38px;
      cursor: pointer;
    }

    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: white;
      font-size: 50px;
      cursor: pointer;
    }

    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }

    @media (max-width: 650px) {
      .page {
        padding: 25px 20px 55px;
      }

      .back {
        width: 42px;
        height: 42px;
      }

      .brand-logo {
        width: 120px;
        max-width: 75%;
        margin: 35px auto 45px;
      }

      .main-artwork {
        max-height: none;
      }

      .thumbnail-area {
        gap: 5px;
        margin-top: 20px;
      }

      .thumb-arrow {
        flex-basis: 18px;
        font-size: 28px;
      }

      .thumbnails {
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 4px;
      }

      .thumbnail {
        border-width: 1px;
      }

      .lightbox {
        padding: 45px 30px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="container">

      <a href="lg-bestshop.html" class="back"
         aria-label="작업물 목록으로 돌아가기">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M22 7L5 24L22 41"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"/>
          <path d="M6 24H43"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </a>

      <img class="brand-logo"
           src="./lg-bestshop.svg"
           alt="LG전자 베스트샵">

      <img id="mainArtwork"
           class="main-artwork"
           src="work01.jpg"
           alt="작업물 메인 이미지">

      <div class="thumbnail-area">
        <button id="thumbPrev" class="thumb-arrow"
                aria-label="이전 썸네일">‹</button>

        <div id="thumbnails" class="thumbnails"></div>

        <button id="thumbNext" class="thumb-arrow"
                aria-label="다음 썸네일">›</button>
      </div>

      <p class="hint">이미지를 클릭하면 크게 볼 수 있습니다.</p>

    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <button id="lightboxClose" class="lightbox-close"
            aria-label="닫기">×</button>
    <button id="lightboxPrev" class="lightbox-prev"
            aria-label="이전 이미지">‹</button>
    <img id="lightboxImage" alt="확대 이미지">
    <button id="lightboxNext" class="lightbox-next"
            aria-label="다음 이미지">›</button>
  </div>

  <script>
    let images = [];
    let currentIndex = 0;
    let thumbStart = 0;
    const thumbsPerPage = 8;

    const mainArtwork = document.getElementById("mainArtwork");
    const thumbnails = document.getElementById("thumbnails");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    async function loadImages() {
      try {
        const response = await fetch("./work01-images.json");
        if (!response.ok) throw new Error("이미지 목록 오류");

        images = await response.json();

        if (!Array.isArray(images) || images.length === 0) {
          return;
        }

        currentIndex = 0;
        thumbStart = 0;
        showImage(0);
      } catch (error) {
        console.error("이미지를 불러오지 못했습니다.", error);
      }
    }

    function showImage(index) {
      if (!images.length) return;

      currentIndex = (index + images.length) % images.length;
      mainArtwork.src = images[currentIndex];

      if (currentIndex < thumbStart ||
          currentIndex >= thumbStart + thumbsPerPage) {
        thumbStart = Math.floor(currentIndex / thumbsPerPage)
                     * thumbsPerPage;
      }

      renderThumbnails();

      if (lightbox.classList.contains("open")) {
        lightboxImage.src = images[currentIndex];
      }
    }

    function renderThumbnails() {
      thumbnails.innerHTML = "";

      images.slice(thumbStart, thumbStart + thumbsPerPage)
        .forEach((src, offset) => {
          const index = thumbStart + offset;
          const img = document.createElement("img");

          img.src = src;
          img.alt = "작업물 " + (index + 1);
          img.className = "thumbnail";

          if (index === currentIndex) {
            img.classList.add("active");
          }

          img.addEventListener("click", () => showImage(index));
          thumbnails.appendChild(img);
        });

      document.getElementById("thumbPrev").disabled =
        thumbStart === 0;

      document.getElementById("thumbNext").disabled =
        thumbStart + thumbsPerPage >= images.length;
    }

    document.getElementById("thumbPrev").onclick = () => {
      thumbStart = Math.max(0, thumbStart - thumbsPerPage);
      renderThumbnails();
    };

    document.getElementById("thumbNext").onclick = () => {
      thumbStart = Math.min(
        Math.floor((images.length - 1) / thumbsPerPage)
          * thumbsPerPage,
        thumbStart + thumbsPerPage
      );
      renderThumbnails();
    };

    mainArtwork.onclick = () => {
      if (!images.length) return;
      lightbox.classList.add("open");
      lightboxImage.src = images[currentIndex];
    };

    function closeLightbox() {
      lightbox.classList.remove("open");
    }

    document.getElementById("lightboxClose").onclick =
      closeLightbox;

    document.getElementById("lightboxPrev").onclick = () => {
      showImage(currentIndex - 1);
    };

    document.getElementById("lightboxNext").onclick = () => {
      showImage(currentIndex + 1);
    };

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (event) => {
      if (!lightbox.classList.contains("open")) return;

      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") showImage(currentIndex - 1);
      if (event.key === "ArrowRight") showImage(currentIndex + 1);
    });

    loadImages();
  </script>
</body>
</html>
