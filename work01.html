
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업물 01 | CitrusAvenue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f7f3;
      color: #222;
    }

    .page {
      min-height: 100vh;
      background-image: url("portfolio-bg.jpg");
      background-position: center top;
      background-size: 100% auto;
      background-repeat: no-repeat;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 30px 120px;
    }

    .back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 2px solid #888;
      border-radius: 50%;
      color: #888;
      text-decoration: none;
      margin: 50px 0 60px;
    }

    .back svg {
      width: 30px;
      height: 30px;
    }

.cover {
  height: 49vw;
  max-height: none;
  min-height: 300px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 15%;
  text-align: center;
  color: white;
}

.cover p {
  margin: 0 0 8px;
  font-family: 'Chetta Vissto', Georgia, serif;
  font-size: clamp(17px, 2.4vw, 30px);
}
@font-face {
  font-family: 'Chetta Vissto';
  src: url('./ChettaVissto.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

.cover h1 {
  margin: 0;
  font-family: 'Chetta Vissto', Georgia, serif;
  font-weight: normal;
  font-size: clamp(42px, 6vw, 84px);
  line-height: 1;
}

.brand-logo {
  display: block;
  width: 250px;
  max-width: 75%;
  height: auto;
  margin: 0 auto 50px;
}

    .artwork {
  display: block;
  width: 100%;
  max-width: 450px;
  height: auto;
  margin: 0 auto;
  cursor: zoom-in;
}


.thumbnail-slider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  max-width: 950px;
  margin: 28px auto 0;
}

.thumbnail-window {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.thumbnails {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 6px;
}

.thumbnails img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  cursor: pointer;
  opacity: 0.65;
  border: 2px solid transparent;
  box-sizing: border-box;
}

.thumbnails img.selected {
  opacity: 1;
  border-color: #888;
}

.thumb-arrow {
  flex: 0 0 30px;
  border: none;
  background: transparent;
  color: #777;
  font-size: 36px;
  cursor: pointer;
  padding: 0;
}

.thumb-arrow:disabled {
  opacity: 0.25;
  cursor: default;
}

.thumbnail-slider:not(.has-overflow) .thumb-arrow {
  display: none;
}

.thumbnail-slider:not(.has-overflow) {
  max-width: 850px;
}


.project-info {
  margin: 40px 0 12px;
  text-align: center;
  font-size: 15px;
}

.project-date {
  margin: 0;
  text-align: center;
  font-size: 15px;
}

    .hint {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 25px;
      border: 0;
      background: none;
      color: white;
      font-size: 38px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .content {
        padding: 35px 20px 80px;
      }

      .lightbox {
        padding: 25px;
      }
    }
    
.lightbox-prev,
.lightbox-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: white;
  font-size: 60px;
  font-weight: 200;
  cursor: pointer;
  padding: 10px 20px;
  z-index: 101;
}

.lightbox-prev {
  left: 20px;
}

.lightbox-next {
  right: 20px;
}

.lightbox-count {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  letter-spacing: 2px;
}

@media (max-width: 600px) {
  .lightbox-prev {
    left: 0;
  }

  .lightbox-next {
    right: 0;
  }

  .lightbox-prev,
  .lightbox-next {
    font-size: 42px;
    padding: 10px;
  }
}

@media (max-width: 650px) {
  .brand-logo {
    width: 100px;
    max-width: 100%;
    height: auto;
    margin: 0 auto 25px;
  }
  
.cover {
  height: 49vw;
  min-height: 0;
  padding: 0 20px;
  box-sizing: border-box;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.cover > div {
    width: 100%;
    text-align: center;
    margin-top: 0;
    transform: translateY(-40px);
}

.cover p {
    font-size: clamp(15px, 3.4vw, 20px);
    margin-bottom: 5px;
}

.cover h1 {
    font-size: clamp(40px, 8vw, 56px);
}

  </style>
</head>

<body>
  <div class="page">

    <header class="cover">
      <div>
        <p>CitrusAvenue's</p>
        <h1>Portfolio</h1>
      </div>
    </header>

    <main class="content">

      <a href="lg-bestshop.html" class="back"
         aria-label="작업물 목록으로 돌아가기">
        <svg viewBox="0 0 48 48" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M22 7L5 24L22 41"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"/>
          <path d="M6 24H43"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </a>

      <img
  class="brand-logo"
  src="./lg-bestshop.svg"
  alt="LG전자 베스트샵"
>

     
<img
  class="artwork"
  id="mainArtwork"
  src="work01.jpg"
  alt="LG전자 베스트샵 카드뉴스 1"
  onclick="openLightbox()"
>


<div class="thumbnail-slider" id="thumbnailSlider">

  <button class="thumb-arrow" id="thumbPrev"
          onclick="slideThumbnails(-1)"
          aria-label="이전 썸네일">‹</button>

  <div class="thumbnail-window">
    <div class="thumbnails" id="thumbnailTrack"></div>
  </div>

  <button class="thumb-arrow" id="thumbNext"
          onclick="slideThumbnails(1)"
          aria-label="다음 썸네일">›</button>

</div>



<p class="project-info" id="projectTitle" style="display:none;"></p>
<p class="project-date" id="projectDate" style="display:none;"></p>


      <p class="hint">이미지를 클릭하면 크게 볼 수 있습니다.</p>

    </main>
  </div>

 
<div class="lightbox" id="lightbox" onclick="closeLightbox()">

  <button class="close"
          onclick="closeLightbox()"
          aria-label="닫기">×</button>

  <button class="lightbox-prev"
          onclick="event.stopPropagation(); moveArtwork(-1)"
          aria-label="이전 이미지">‹</button>

  <img src="work01.jpg"
       alt="확대 이미지"
       onclick="event.stopPropagation()">

  <button class="lightbox-next"
          onclick="event.stopPropagation(); moveArtwork(1)"
          aria-label="다음 이미지">›</button>

  <div class="lightbox-count" id="lightboxCount">1 / 8</div>

</div>

<script>
let images = [];

async function loadImages() {
  try {
    const response = await fetch("./work01-images.json");

    if (!response.ok) {
      throw new Error("이미지 목록을 불러오지 못했습니다.");
    }

    images = await response.json();

    if (images.length === 0) {
      throw new Error("등록된 이미지가 없습니다.");
    }

    changeArtwork(0);
  } catch (error) {
    console.error(error);
  }
}


let currentIndex = 0;
let thumbnailStart = 0;
const visibleCount = 8;

// 썸네일 생성 및 표시
function renderThumbnails() {
  const track = document.getElementById("thumbnailTrack");
  const slider = document.getElementById("thumbnailSlider");

  const hasOverflow = images.length > visibleCount;
  slider.classList.toggle("has-overflow", hasOverflow);

  const visibleImages = images.slice(
    thumbnailStart,
    thumbnailStart + visibleCount
  );

  track.innerHTML = "";

  visibleImages.forEach((src, offset) => {
    const index = thumbnailStart + offset;
    const img = document.createElement("img");

    img.src = src;
    img.alt = index === 0 ? "표지" : "카드뉴스 " + (index + 1);
    img.classList.toggle("selected", index === currentIndex);
    img.onclick = () => changeArtwork(index);

    track.appendChild(img);
  });

  document.getElementById("thumbPrev").disabled =
    thumbnailStart === 0;

  document.getElementById("thumbNext").disabled =
    thumbnailStart >= images.length - visibleCount;
}

// 썸네일 좌우 이동
function slideThumbnails(direction) {
  const maxStart = Math.max(0, images.length - visibleCount);

  thumbnailStart = Math.max(
    0,
    Math.min(maxStart, thumbnailStart + direction)
  );

  renderThumbnails();
}

async function loadProjectInfo() {
  try {
    
const response = await fetch("./project-info-generated.json");

    if (!response.ok) throw new Error("작업물 정보를 불러오지 못했습니다.");

    const allInfo = await response.json();

    const projectId =
      window.location.pathname.match(/work\d+(?=\.html)/i)?.[0] || "work01";

    const info = allInfo[projectId];
    if (!info) return;

    document.getElementById("projectTitle").textContent =
      info.title || "";

    document.getElementById("projectDate").textContent =
      info.date || "";
  } catch (error) {
    console.error(error);
  }
}

loadProjectInfo();

  loadImages();

// 큰 이미지 변경
function changeArtwork(index) {
  currentIndex = index;

  document.getElementById("mainArtwork").src = images[index];
  document.querySelector("#lightbox img").src = images[index];

  document.getElementById("lightboxCount").textContent =
    (index + 1) + " / " + images.length;

  // 선택된 이미지가 썸네일 화면 밖에 있으면 자동 이동
  if (index < thumbnailStart) {
    thumbnailStart = index;
  } else if (index >= thumbnailStart + visibleCount) {
    thumbnailStart = index - visibleCount + 1;
  }

  renderThumbnails();
}

// 확대 화면 이미지 이동
function moveArtwork(direction) {
  const nextIndex =
    (currentIndex + direction + images.length) % images.length;

  changeArtwork(nextIndex);
}

// 확대 화면 열기
function openLightbox() {
  document.getElementById("lightbox").classList.add("open");
}

// 확대 화면 닫기
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

// 키보드 조작
document.addEventListener("keydown", function(event) {
  const lightbox = document.getElementById("lightbox");

  if (event.key === "Escape") {
    closeLightbox();
  }

  if (!lightbox.classList.contains("open")) return;

  if (event.key === "ArrowLeft") {
    moveArtwork(-1);
  }

  if (event.key === "ArrowRight") {
    moveArtwork(1);
  }
});

// 페이지가 열리면 썸네일 생성
loadImages();
</script>


</body>
</html>
