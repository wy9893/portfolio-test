
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업물 01 | CitrusAvenue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f7f3;
      color: #222;
    }

    .page {
      min-height: 100vh;
      background-image: url("portfolio-bg.jpg");
      background-position: center top;
      background-size: 100% auto;
      background-repeat: no-repeat;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 30px 120px;
    }

    .back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 2px solid #888;
      border-radius: 50%;
      color: #888;
      text-decoration: none;
      margin: 50px 0 60px;
    }

    .back svg {
      width: 30px;
      height: 30px;
    }

.cover {
  height: 49vw;
  max-height: none;
  min-height: 300px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 15%;
  text-align: center;
  color: white;
}

.cover p {
  margin: 0 0 8px;
  font-family: 'Chetta Vissto', Georgia, serif;
  font-size: clamp(17px, 2.4vw, 30px);
}
@font-face {
  font-family: 'Chetta Vissto';
  src: url('./ChettaVissto.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

.cover h1 {
  margin: 0;
  font-family: 'Chetta Vissto', Georgia, serif;
  font-weight: normal;
  font-size: clamp(42px, 6vw, 84px);
  line-height: 1;
}

.brand-logo {
  display: block;
  width: 250px;
  max-width: 75%;
  height: auto;
  margin: 0 auto 50px;
}

    .artwork {
  display: block;
  width: 100%;
  max-width: 450px;
  height: auto;
  margin: 0 auto;
  cursor: zoom-in;
}

.thumbnails {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 6px;
  max-width: 850px;
  margin: 28px auto 0;
}

.thumbnails img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  cursor: pointer;
  opacity: 0.65;
  border: 2px solid transparent;
}

.thumbnails img.selected {
  opacity: 1;
  border-color: #888;
}

.project-info {
  margin: 40px 0 12px;
  text-align: center;
  font-size: 15px;
}

.project-date {
  margin: 0;
  text-align: center;
  font-size: 15px;
}

    .hint {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 25px;
      border: 0;
      background: none;
      color: white;
      font-size: 38px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .content {
        padding: 35px 20px 80px;
      }

      .lightbox {
        padding: 25px;
      }
    }
    
.lightbox-prev,
.lightbox-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: white;
  font-size: 60px;
  font-weight: 200;
  cursor: pointer;
  padding: 10px 20px;
  z-index: 101;
}

.lightbox-prev {
  left: 20px;
}

.lightbox-next {
  right: 20px;
}

.lightbox-count {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  letter-spacing: 2px;
}

@media (max-width: 600px) {
  .lightbox-prev {
    left: 0;
  }

  .lightbox-next {
    right: 0;
  }

  .lightbox-prev,
  .lightbox-next {
    font-size: 42px;
    padding: 10px;
  }
}

  </style>
</head>

<body>
  <div class="page">

    <header class="cover">
      <div>
        <p>CitrusAvenue's</p>
        <h1>Portfolio</h1>
      </div>
    </header>

    <main class="content">

      <a href="lg-bestshop.html" class="back"
         aria-label="작업물 목록으로 돌아가기">
        <svg viewBox="0 0 48 48" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M22 7L5 24L22 41"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"/>
          <path d="M6 24H43"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </a>

      <img
  class="brand-logo"
  src="./lg-bestshop.svg"
  alt="LG전자 베스트샵"
>

     
<img
  class="artwork"
  id="mainArtwork"
  src="work01.jpg"
  alt="LG전자 베스트샵 카드뉴스 1"
  onclick="openLightbox()"
>

<div class="thumbnails">
  <img src="work01.jpg" alt="표지" class="selected" onclick="changeArtwork(0)">
  <img src="work01-02.jpg" alt="카드뉴스 2" onclick="changeArtwork(1)">
  <img src="work01-03.jpg" alt="카드뉴스 3" onclick="changeArtwork(2)">
  <img src="work01-04.jpg" alt="카드뉴스 4" onclick="changeArtwork(3)">
  <img src="work01-05.jpg" alt="카드뉴스 5" onclick="changeArtwork(4)">
  <img src="work01-06.jpg" alt="카드뉴스 6" onclick="changeArtwork(5)">
  <img src="work01-07.jpg" alt="카드뉴스 7" onclick="changeArtwork(6)">
  <img src="work01-08.jpg" alt="카드뉴스 8" onclick="changeArtwork(7)">
</div>

<p class="project-info">
  카드뉴스 / LG전자 베스트샵 더현대 서울 / Open Sale
</p>
<p class="project-date">2026. 10. 02</p>


      <p class="hint">이미지를 클릭하면 크게 볼 수 있습니다.</p>

    </main>
  </div>

 
<div class="lightbox" id="lightbox" onclick="closeLightbox()">

  <button class="close"
          onclick="closeLightbox()"
          aria-label="닫기">×</button>

  <button class="lightbox-prev"
          onclick="event.stopPropagation(); moveArtwork(-1)"
          aria-label="이전 이미지">‹</button>

  <img src="work01.jpg"
       alt="확대 이미지"
       onclick="event.stopPropagation()">

  <button class="lightbox-next"
          onclick="event.stopPropagation(); moveArtwork(1)"
          aria-label="다음 이미지">›</button>

  <div class="lightbox-count" id="lightboxCount">1 / 8</div>

</div>


 
<script>
const images = [
  "work01.jpg",
  "work01-02.jpg",
  "work01-03.jpg",
  "work01-04.jpg",
  "work01-05.jpg",
  "work01-06.jpg",
  "work01-07.jpg",
  "work01-08.jpg"
];

let currentIndex = 0;

// 썸네일 클릭 시 큰 이미지 변경
function changeArtwork(index) {
  currentIndex = index;

  document.getElementById("mainArtwork").src = images[index];

  document.querySelectorAll(".thumbnails img").forEach((img, i) => {
    img.classList.toggle("selected", i === index);
  });

  document.querySelector("#lightbox img").src = images[index];

  document.getElementById("lightboxCount").textContent =
    (index + 1) + " / " + images.length;
}

// 확대 화면에서 좌우 이미지 이동
function moveArtwork(direction) {
  const nextIndex =
    (currentIndex + direction + images.length) % images.length;

  changeArtwork(nextIndex);
}

// 이미지 확대
function openLightbox() {
  document.getElementById("lightbox").classList.add("open");
}

// 확대 화면 닫기
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

// 키보드 방향키 및 ESC
document.addEventListener("keydown", function(event) {
  const lightbox = document.getElementById("lightbox");

  if (event.key === "Escape") {
    closeLightbox();
  }

  if (!lightbox.classList.contains("open")) return;

  if (event.key === "ArrowLeft") {
    moveArtwork(-1);
  }

  if (event.key === "ArrowRight") {
    moveArtwork(1);
  }
});
</script>

</body>
</html>
